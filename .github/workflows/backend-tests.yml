name: Backend Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    # This spins up a temporary Postgres database just for the tests!
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
          POSTGRES_DB: charity_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d charity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22" # Matching your Go version

      - name: Download Dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run All Tests
        working-directory: ./backend
        env:
          # FIX 2: Dynamically build the DB URL using those same secrets!
          DB_URL: "postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@localhost:5435/charity_test?sslmode=disable"
          DATABASE_URL: "postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@localhost:5435/charity_test?sslmode=disable"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        # Inject the environment variables your tests need to connect to the temp DB
        run: go test -v ./...
