name: Backend Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    # This spins up a temporary Postgres database just for the tests!
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: charity_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22" # Matching your Go version

      - name: Download Dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run All Tests
        working-directory: ./backend
        # Inject the environment variables your tests need to connect to the temp DB
        env:
          DB_URL: "postgres://testuser:testpassword@localhost:5435/charity_test?sslmode=disable"
          JWT_SECRET: "test_secret_key"
          # Add any other variables your config looks for in the .env file here!
        run: go test -v ./...
